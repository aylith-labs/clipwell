name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'engineering/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # A gate on push/pull_request cannot block this workflow, so it verifies the
  # sites itself before anything is published.
  verify:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        site: [docs, engineering]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install
        working-directory: ${{ matrix.site }}
        run: npm ci
      - name: Type-check
        working-directory: ${{ matrix.site }}
        run: npm run types:check
      - name: Lint (Biome)
        working-directory: ${{ matrix.site }}
        run: npm run lint

  build:
    needs: verify
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build feature docs (site root)
        working-directory: docs
        env:
          PAGES_BASE: /clipwell
        run: |
          npm ci
          npm run build

      - name: Build engineering docs (/engineering)
        working-directory: engineering
        env:
          PAGES_BASE: /clipwell/engineering
        run: |
          npm ci
          npm run build

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r docs/out/* _site/
          mkdir -p _site/engineering
          cp -r engineering/out/* _site/engineering/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
