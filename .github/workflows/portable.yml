name: Portable Linux package

# Builds clipwell-VERSION-linux-x64.tar.gz (apps + web UI + bundled .NET
# runtime), smoke-tests the extracted archive against an isolated daemon, and
# uploads it as an artifact. With publish_release it also creates the GitHub
# release v<version> carrying the archive and its checksum.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version (semantic, e.g. 0.3.0)
        required: true
        type: string
      publish_release:
        description: Create GitHub release v<version> with the archive
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  package:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: oven-sh/setup-bun@v2

      - name: Build and test
        run: |
          dotnet build clipwell.slnx -c Release
          dotnet test clipwell.slnx -c Release --no-build

      - name: Package
        run: python3 scripts/package-portable.py "${{ inputs.version }}" --output artifacts

      - name: Smoke-test the extracted archive
        run: bash scripts/check-portable.sh "artifacts/clipwell-${{ inputs.version }}-linux-x64.tar.gz"

      - uses: actions/upload-artifact@v7
        with:
          name: clipwell-${{ inputs.version }}-linux-x64
          path: artifacts/*
          if-no-files-found: error

  release:
    if: inputs.publish_release && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: clipwell-${{ inputs.version }}-linux-x64
          path: artifacts
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v$VERSION" artifacts/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Clipwell $VERSION" \
            --notes "Portable Linux x64 package. See INSTALL.md inside the archive or https://github.com/$GITHUB_REPOSITORY/blob/main/docs/portable-install.md."
